[build-system]
requires = ["setuptools==80.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "weightspaceprogramming"
version = "0.1.0"
description = "Learn weight-space programming with runnable NumPy experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
license = "Apache-2.0"
license-files = ["LICENSE", "SOURCES.md"]
keywords = ["weight-space-programming", "neural-networks", "education", "lora", "numpy"]
classifiers = [
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://weightspaceprogramming.tech/"
Examples = "https://github.com/weightspaceprogramming/examples"
Guide = "https://weightspaceprogramming.tech/build/code-and-implementations/"
Source = "https://github.com/weightspaceprogramming/weightspaceprogramming"
Issues = "https://github.com/weightspaceprogramming/weightspaceprogramming/issues"

[project.scripts]
weightspaceprogramming = "weightspaceprogramming.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["weightspaceprogramming"]
include-package-data = false

[tool.setuptools.package-data]
weightspaceprogramming = ["lessons.json"]
